defaults:
  - eval_vggt_eth3d_local.yaml
  - _self_


model:
  patch_module:
    type: ranked_middle_keys
    selection: middle_random
    top_ratio: 0.1
    final_ratio: 0.2
    drop_bottom_ratio: 0.5
    q_sample_count: 256
    spatial_radius: 2
    temporal_radius: 4
    ctx_chunk_size: 256
    include_special_keys: True
    seed: 0

datasets:
  eth3d:
    eval_tasks: [pose, recon_unposed]
